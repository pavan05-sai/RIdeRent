services:
  # ── Spring Boot Backend ──────────────────────────────────────────────────
  - type: web
    name: riderent-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: riderent-db
          property: connectionString
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: CORS_ALLOWED_ORIGINS
        value: https://riderent.vercel.app

databases:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  - name: riderent-db
    region: oregon
    plan: free
    databaseName: riderent_db
    user: riderent_user
